# Fly.io deployment for the Next.js + FastAPI build.
#
# One machine serves both halves from the Dockerfile: the exported static site
# and the model API on the same origin. Change `primary_region` to whichever
# Fly region is nearest the audience (`fly platform regions` lists them).

app = "tax-burden-equity-analyzer"
primary_region = "iad"

# A safety net rather than headroom. Warming every model path peaks at a
# measured 1,656 MB, and TreeExplainer is most of it. Without swap the kernel
# OOM-kills the process and the site dies mid-demo; with it, an overshoot pages
# out and merely gets slower.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[http_service]
  # Matches the Dockerfile CMD, which binds ${PORT:-7860} and Fly sets no PORT.
  internal_port = 7860
  force_https = true

  # Deliberately always-on. A stopped machine costs nothing but makes the next
  # visitor wait through a container start, a 276 MB artifact fetch and a ~5s
  # model load. This app exists to be clicked once by someone who will not wait.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Liveness, not readiness. /livez answers as soon as the process is up, while
# the model downloads and warms in the background; /healthz stays 503 until the
# model can actually answer. Checking readiness here would destroy the machine
# for still loading, which is exactly how the first deploy failed.
[[http_service.checks]]
  method = "GET"
  path = "/livez"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  memory = "2gb"
  cpus = 1
  cpu_kind = "shared"
